AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Accelya M1 - raw-zone ingest Lambda (S3 -> Lambda -> CloudWatch) plus a
  cross-role probe (Lambda -> STS AssumeRole -> S3 list) used to learn
  identity policy vs trust policy.

Parameters:
  LearnerId:
    Type: String
    Description: Your short learner id, lowercase (e.g. priya, rahul-k)
    AllowedPattern: '^[a-z0-9-]{2,20}$'
    ConstraintDescription: 2-20 chars, lowercase letters, digits, hyphen
  TrustMode:
    Type: String
    AllowedValues: [open, locked]
    Default: open
    Description: open = reader role trusts the ingest role; locked = also demands an ExternalId
  ProbeExternalId:
    Type: String
    Default: ''
    Description: ExternalId the Lambda sends when assuming the reader role (blank = none)
  ExistingRoleArn:
    Type: String
    Default: ''
    Description: Leave blank. Set ONLY if your sandbox blocks iam:CreateRole (fallback mode, no probe).

Conditions:
  CreateRoles: !Equals [!Ref ExistingRoleArn, '']
  TrustLocked: !Equals [!Ref TrustMode, locked]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Architectures: [x86_64]

Resources:
  # ---------- S3: your raw zone ----------
  RawBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'accelya-m1-${LearnerId}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled                # landing zone is append-only: re-uploads keep the old version
      LifecycleConfiguration:
        Rules:
          - Id: raw-expire-old-versions
            Status: Enabled
            Prefix: raw/
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true     # feeds CountRowsFunction without clashing with the raw/ S3 trigger

  RawBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RawBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt RawBucket.Arn
              - !Sub '${RawBucket.Arn}/*'
            Condition:
              Bool: { 'aws:SecureTransport': 'false' }

  # ---------- IAM: identity the Lambda runs as ----------
  IngestRole:
    Type: AWS::IAM::Role
    Condition: CreateRoles
    Properties:
      RoleName: !Sub 'accelya-m1-${LearnerId}-ingest-role'
      AssumeRolePolicyDocument:            # TRUST policy: who may wear this role
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:                            # IDENTITY policy: what the role may do
        - PolicyName: read-raw-zone
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:aws:s3:::accelya-m1-${LearnerId}-${AWS::AccountId}/raw/*'

  # ---------- IAM: a second role the Lambda will try to assume ----------
  ReaderRole:
    Type: AWS::IAM::Role
    Condition: CreateRoles
    Properties:
      RoleName: !Sub 'accelya-m1-${LearnerId}-reader-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { AWS: !GetAtt IngestRole.Arn }
            Action: sts:AssumeRole
            Condition: !If
              - TrustLocked
              - StringEquals: { 'sts:ExternalId': 'accelya-m1-partner' }
              - !Ref AWS::NoValue
      Policies:
        - PolicyName: list-validated-zone
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:aws:s3:::accelya-m1-${LearnerId}-${AWS::AccountId}'
                Condition:
                  StringLike: { 's3:prefix': ['validated/*'] }

  # Identity side of the hop: ingest role is ALLOWED to call sts:AssumeRole on the reader role.
  # Kept as a separate policy to avoid a circular reference between the two roles.
  IngestCanAssumeReader:
    Type: AWS::IAM::Policy
    Condition: CreateRoles
    Properties:
      PolicyName: assume-reader-role
      Roles: [!Ref IngestRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Resource: !GetAtt ReaderRole.Arn

  # ---------- Logs: explicit retention, never "Never Expire" ----------
  IngestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/accelya-m1-${LearnerId}-ingest'
      RetentionInDays: 7

  # ---------- Lambda ----------
  IngestFunction:
    Type: AWS::Serverless::Function
    DependsOn: IngestLogGroup
    Properties:
      FunctionName: !Sub 'accelya-m1-${LearnerId}-ingest'
      CodeUri: src/ingest/
      Handler: app.handler
      Role: !If [CreateRoles, !GetAtt IngestRole.Arn, !Ref ExistingRoleArn]
      Environment:
        Variables:
          LEARNER_ID: !Ref LearnerId
          PROBE_ROLE_ARN: !If [CreateRoles, !GetAtt ReaderRole.Arn, '']
          PROBE_EXTERNAL_ID: !Ref ProbeExternalId
      Events:
        RawUpload:
          Type: S3
          Properties:
            Bucket: !Ref RawBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: raw/

  # ---------- Option A: raw/*.csv -> EventBridge -> SQS -> Lambda -> DynamoDB ----------
  CountRowsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'accelya-m1-${LearnerId}-count-rows-dlq'
      MessageRetentionPeriod: 1209600        # 14 days to investigate
      SqsManagedSseEnabled: true

  CountRowsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'accelya-m1-${LearnerId}-count-rows'
      VisibilityTimeout: 180                 # >= 6x the function timeout (30s)
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CountRowsDLQ.Arn
        maxReceiveCount: 3

  CountRowsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref CountRowsQueue, !Ref CountRowsDLQ]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowOwnEventBridgeRule
            Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sqs:SendMessage
            Resource: [!GetAtt CountRowsQueue.Arn, !GetAtt CountRowsDLQ.Arn]
            Condition:
              ArnEquals: { 'aws:SourceArn': !GetAtt RawCsvRule.Arn }

  RawCsvRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub 'accelya-m1-${LearnerId}-raw-csv'
      EventPattern:
        source: [aws.s3]
        detail-type: [Object Created]
        detail:
          bucket: { name: [!Ref RawBucket] }
          object: { key: [{ wildcard: 'raw/*.csv' }] }
      Targets:
        - Id: count-rows-queue
          Arn: !GetAtt CountRowsQueue.Arn
          DeadLetterConfig: { Arn: !GetAtt CountRowsDLQ.Arn }
          RetryPolicy: { MaximumRetryAttempts: 24, MaximumEventAgeInSeconds: 3600 }

  FileCountsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'accelya-m1-${LearnerId}-file-counts'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }          # <airline>#<file date>
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }

  CountRowsRole:
    Type: AWS::IAM::Role
    Condition: CreateRoles
    Properties:
      RoleName: !Sub 'accelya-m1-${LearnerId}-count-rows-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: count-rows-least-privilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadRawZoneOnly
                Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub 'arn:aws:s3:::accelya-m1-${LearnerId}-${AWS::AccountId}/raw/*'
              - Sid: ConsumeOwnQueue
                Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
                Resource: !GetAtt CountRowsQueue.Arn
              - Sid: WriteResultRow
                Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt FileCountsTable.Arn
              - Sid: WriteOwnLogStream
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub '${CountRowsLogGroup.Arn}:*'

  CountRowsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/accelya-m1-${LearnerId}-count-rows'
      RetentionInDays: 7

  CountRowsFunction:
    Type: AWS::Serverless::Function
    DependsOn: CountRowsLogGroup
    Properties:
      FunctionName: !Sub 'accelya-m1-${LearnerId}-count-rows'
      CodeUri: src/count_rows/
      Handler: app.handler
      Role: !If [CreateRoles, !GetAtt CountRowsRole.Arn, !Ref ExistingRoleArn]
      Environment:
        Variables:
          LEARNER_ID: !Ref LearnerId
          TABLE_NAME: !Ref FileCountsTable
      Events:
        FromQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt CountRowsQueue.Arn
            BatchSize: 1

Outputs:
  BucketName:
    Value: !Ref RawBucket
  FunctionName:
    Value: !Ref IngestFunction
  LogGroup:
    Value: !Ref IngestLogGroup
  IngestRoleArn:
    Condition: CreateRoles
    Value: !GetAtt IngestRole.Arn
  ReaderRoleArn:
    Condition: CreateRoles
    Value: !GetAtt ReaderRole.Arn
  CountsTableName:
    Value: !Ref FileCountsTable
  CountRowsQueueUrl:
    Value: !Ref CountRowsQueue
  CountRowsDlqUrl:
    Value: !Ref CountRowsDLQ
