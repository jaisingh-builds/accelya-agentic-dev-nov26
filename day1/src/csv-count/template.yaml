AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Accelya M1 - csv-count Lambda (S3 -> Lambda -> CloudWatch). Counts data rows in each
  CSV uploaded under raw/ and logs the count per docs/LOGGING_CONTRACT.md.
  Own bucket: S3 rejects overlapping raw/ notifications on the ingest stack's bucket.

Parameters:
  LearnerId:
    Type: String
    Description: Your short learner id, lowercase (e.g. priya, rahul-k)
    AllowedPattern: '^[a-z0-9-]{2,20}$'
    ConstraintDescription: 2-20 chars, lowercase letters, digits, hyphen
  LandingRetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 365
    Description: Days a file stays in the raw/ landing zone before it expires

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Architectures: [x86_64]

Resources:
  # ---------- S3: landing zone (raw/) for csv-count ----------
  CsvCountBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'accelya-m1-${LearnerId}-csv-count-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:                   # ACLs off: the bucket owner owns every landed file
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:             # an overwritten or deleted landed file stays recoverable
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: landing-raw-retention
            Status: Enabled
            Prefix: raw/
            ExpirationInDays: !Ref LandingRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: purge-expired-delete-markers
            Status: Enabled
            ExpiredObjectDeleteMarker: true

  CsvCountBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CsvCountBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyNonTls
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt CsvCountBucket.Arn
              - !Sub '${CsvCountBucket.Arn}/*'
            Condition:
              Bool: { 'aws:SecureTransport': 'false' }

  # ---------- Logs: explicit retention, never "Never Expire" ----------
  CsvCountLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/accelya-m1-${LearnerId}-csv-count'
      RetentionInDays: 7

  # ---------- IAM: identity the Lambda runs as ----------
  CsvCountRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'accelya-m1-${LearnerId}-csv-count-role'
      AssumeRolePolicyDocument:            # TRUST policy: who may wear this role
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:                            # IDENTITY policy: what the role may do
        - PolicyName: read-raw-zone
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject       # covers HeadObject too
                Resource: !Sub 'arn:${AWS::Partition}:s3:::accelya-m1-${LearnerId}-csv-count-${AWS::AccountId}/raw/*'
        - PolicyName: write-own-log-group  # instead of AWSLambdaBasicExecutionRole (Resource "*")
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/accelya-m1-${LearnerId}-csv-count:*'

  # ---------- Lambda ----------
  CsvCountFunction:
    Type: AWS::Serverless::Function
    DependsOn: CsvCountLogGroup
    Properties:
      FunctionName: !Sub 'accelya-m1-${LearnerId}-csv-count'
      CodeUri: .
      Handler: app.handler
      Role: !GetAtt CsvCountRole.Arn
      Environment:
        Variables:
          LEARNER_ID: !Ref LearnerId
      Events:
        RawUpload:
          Type: S3
          Properties:
            Bucket: !Ref CsvCountBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: raw/
                  - Name: suffix
                    Value: .csv

Outputs:
  BucketName:
    Value: !Ref CsvCountBucket
  LandingZoneUri:
    Value: !Sub 's3://${CsvCountBucket}/raw/'
  FunctionName:
    Value: !Ref CsvCountFunction
  LogGroup:
    Value: !Ref CsvCountLogGroup
  RoleArn:
    Value: !GetAtt CsvCountRole.Arn
