AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Accelya M1 Lab 1 - Option 1 (revised after HITL review):
  S3 raw/ -> Parser Lambda -> DynamoDB -> EventBridge (every minute) -> Aggregator Lambda -> SNS (finance).
  Per-airline ticket counts reach finance within ~2 minutes; a re-uploaded file is counted once.

Parameters:
  LearnerId:
    Type: String
    Description: Your short learner id, lowercase (e.g. priya, rahul-k)
    AllowedPattern: '^[a-z0-9-]{2,20}$'
    ConstraintDescription: 2-20 chars, lowercase letters, digits, hyphen

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Architectures: [x86_64]

Resources:
  # ---------- S3: landing zone, kept unchanged for audit ----------
  RawBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'accelya-m1-${LearnerId}-opt1-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled                  # an overwrite keeps the original version for audit
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # ---------- DynamoDB: the ledger ----------
  # FILE#<etag> / FILE           -> one item per distinct file (dedupe guard)
  # WINDOW#<yyyy-mm-ddTHH:MM> / <airline>#<etag> -> per-airline count, read by the aggregator one minute at a time
  CountsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'accelya-m1-${LearnerId}-opt1-counts'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  # ---------- SNS: finance notification ----------
  FinanceTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'accelya-m1-${LearnerId}-opt1-finance'
      KmsMasterKeyId: alias/aws/sns

  # ---------- SQS: where a file lands after the parser fails 3 times ----------
  ParserDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'accelya-m1-${LearnerId}-opt1-parser-dlq'
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

  # ---------- Logs: explicit retention ----------
  ParserLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/accelya-m1-${LearnerId}-opt1-parser'
      RetentionInDays: 7
  AggregatorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/accelya-m1-${LearnerId}-opt1-aggregator'
      RetentionInDays: 7

  # ---------- IAM: one role per function, named actions on ARN-scoped resources ----------
  ParserRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'accelya-m1-${LearnerId}-opt1-parser-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: parser
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ParserLogGroup.Arn
              - Effect: Allow
                Action: s3:GetObject
                # string ARN, not !GetAtt, to avoid a bucket <-> notification circular dependency
                Resource: !Sub 'arn:aws:s3:::accelya-m1-${LearnerId}-opt1-${AWS::AccountId}/raw/*'
              - Effect: Allow
                Action: dynamodb:PutItem          # TransactWriteItems is authorised per item action
                Resource: !GetAtt CountsTable.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ParserDLQ.Arn

  AggregatorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'accelya-m1-${LearnerId}-opt1-aggregator-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: aggregator
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt AggregatorLogGroup.Arn
              - Effect: Allow
                Action: dynamodb:Query
                Resource: !GetAtt CountsTable.Arn
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref FinanceTopic

  # ---------- Lambdas (2 of the course's 10) ----------
  ParserFunction:
    Type: AWS::Serverless::Function
    DependsOn: ParserLogGroup
    Properties:
      FunctionName: !Sub 'accelya-m1-${LearnerId}-opt1-parser'
      CodeUri: src/parser/
      Handler: app.handler
      Role: !GetAtt ParserRole.Arn
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt ParserDLQ.Arn
      Environment:
        Variables:
          LEARNER_ID: !Ref LearnerId
          TABLE_NAME: !Ref CountsTable
      Events:
        RawUpload:
          Type: S3
          Properties:
            Bucket: !Ref RawBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - { Name: prefix, Value: raw/ }
                  - { Name: suffix, Value: .csv }

  AggregatorFunction:
    Type: AWS::Serverless::Function
    DependsOn: AggregatorLogGroup
    Properties:
      FunctionName: !Sub 'accelya-m1-${LearnerId}-opt1-aggregator'
      CodeUri: src/aggregator/
      Handler: app.handler
      Role: !GetAtt AggregatorRole.Arn
      Environment:
        Variables:
          LEARNER_ID: !Ref LearnerId
          TABLE_NAME: !Ref CountsTable
          TOPIC_ARN: !Ref FinanceTopic
      Events:
        EveryMinute:
          Type: Schedule
          Properties:
            Name: !Sub 'accelya-m1-${LearnerId}-opt1-every-minute'
            Schedule: rate(1 minute)

Outputs:
  BucketName:
    Value: !Ref RawBucket
  TableName:
    Value: !Ref CountsTable
  TopicArn:
    Value: !Ref FinanceTopic
  ParserDLQUrl:
    Value: !Ref ParserDLQ
  ParserLogGroup:
    Value: !Ref ParserLogGroup
  AggregatorLogGroup:
    Value: !Ref AggregatorLogGroup
