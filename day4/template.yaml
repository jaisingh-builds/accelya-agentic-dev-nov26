AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Accelya M4 - batch processor. S3 raw/ -> Lambda -> validated/, quarantine/<reason>/, manifests/.
  Powertools Logger shaped to the course logging contract; failed async events go to a DLQ.

Parameters:
  LearnerId:
    Type: String
    AllowedPattern: '^[a-z0-9-]{2,20}$'
    ConstraintDescription: 2-20 chars, lowercase letters, digits, hyphen
  PowertoolsLayerArn:
    Type: String
    # Pinned: layer 44 = Powertools 3.41.0, the same version as requirements.txt.
    # (SSM name for the same layer: /aws/service/powertools/python/x86_64/python3.12/3.41.0)
    Default: arn:aws:lambda:us-east-1:017000801446:layer:AWSLambdaPowertoolsPythonV3-python312-x86_64:44
  LogLevel:
    Type: String
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]
    Default: INFO                 # DEBUG is for local diagnosis only (logging contract)

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'accelya-m4-${LearnerId}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  ProcessorDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'accelya-m4-${LearnerId}-processor-dlq'
      MessageRetentionPeriod: 345600          # 4 days: long enough for a human to look
      SqsManagedSseEnabled: true

  ProcessorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'accelya-m4-${LearnerId}-processor-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: zones
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow                  # read the input and the previous manifest
                Action: s3:GetObject
                Resource:
                  - !Sub 'arn:aws:s3:::accelya-m4-${LearnerId}-${AWS::AccountId}/raw/*'
                  - !Sub 'arn:aws:s3:::accelya-m4-${LearnerId}-${AWS::AccountId}/manifests/*'
              - Effect: Allow                  # without ListBucket a missing key is 403, not 404
                Action: s3:ListBucket
                Resource: !Sub 'arn:aws:s3:::accelya-m4-${LearnerId}-${AWS::AccountId}'
                Condition:
                  StringLike: { 's3:prefix': ['raw/*', 'manifests/*'] }
              - Effect: Allow                  # write only the output zones, never raw/
                Action: s3:PutObject
                Resource:
                  - !Sub 'arn:aws:s3:::accelya-m4-${LearnerId}-${AWS::AccountId}/validated/*'
                  - !Sub 'arn:aws:s3:::accelya-m4-${LearnerId}-${AWS::AccountId}/quarantine/*'
                  - !Sub 'arn:aws:s3:::accelya-m4-${LearnerId}-${AWS::AccountId}/manifests/*'
              - Effect: Allow                  # Lambda's async DLQ is written with the function's role
                Action: sqs:SendMessage
                Resource: !GetAtt ProcessorDLQ.Arn

  # Lab 4: retention is a deliberate setting. As shipped, this log group keeps logs FOREVER
  # ("Never Expire"). Add RetentionInDays, redeploy and prove it with describe-log-groups.
  ProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/accelya-m4-${LearnerId}-processor'
      RetentionInDays: 14

  ProcessorFunction:
    Type: AWS::Serverless::Function
    DependsOn: ProcessorLogGroup
    Properties:
      FunctionName: !Sub 'accelya-m4-${LearnerId}-processor'
      CodeUri: src/processor/
      Handler: handler.handler
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt ProcessorRole.Arn
      Layers: [!Ref PowertoolsLayerArn]
      Environment:
        Variables:
          LEARNER_ID: !Ref LearnerId
          POWERTOOLS_LOG_LEVEL: !Ref LogLevel
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt ProcessorDLQ.Arn
      EventInvokeConfig:
        MaximumRetryAttempts: 2               # the default, made explicit
        MaximumEventAgeInSeconds: 3600
      Events:
        RawUpload:
          Type: S3
          Properties:
            Bucket: !Ref DataBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - { Name: prefix, Value: raw/ }

Outputs:
  BucketName:
    Value: !Ref DataBucket
  FunctionName:
    Value: !Ref ProcessorFunction
  LogGroup:
    Value: !Ref ProcessorLogGroup
  DlqUrl:
    Value: !Ref ProcessorDLQ
